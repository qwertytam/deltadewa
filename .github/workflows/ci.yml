name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: poetry

      - name: Install Poetry
        run: pip install "poetry>=2.0,<3"

      - name: Configure in-project virtualenv
        run: poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Pylint
        run: poetry run pylint deltadewa

      - name: Mypy type-check
        run: poetry run mypy deltadewa

      - name: Pytest
        run: poetry run pytest

      - name: nbqa ruff — monitor_dashboard
        run: poetry run nbqa ruff monitor_dashboard.ipynb

      - name: nbqa ruff — hedge_design
        run: poetry run nbqa ruff hedge_design.ipynb

      - name: Execute monitor_dashboard notebook
        env:
          _USE_LIVE: "False"
          MPLBACKEND: Agg
        run: |
          poetry run jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=600 \
            monitor_dashboard.ipynb

      - name: Execute hedge_design notebook
        env:
          _USE_LIVE: "False"
          MPLBACKEND: Agg
        run: |
          poetry run jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=600 \
            hedge_design.ipynb
