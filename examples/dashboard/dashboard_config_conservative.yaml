# Conservative Hedge Health Dashboard Configuration
# More stringent thresholds for risk-averse portfolios.
# Triggers alerts earlier and requires higher performance standards.

# PRESENTATION ONLY — gauge geometry. A conservative posture is a policy choice,
# so its thresholds belong to the IPS, not here. Set them in config/ips.yaml:
#   convexity.cliff_threshold_days: 240   # warn 8 months out (vs 180 default)
#   convexity.cliff_review_days: 120
#   convexity.cliff_urgent_days: 60
#   vega.sufficiency_min_pct / _max_pct   # tighter than the default 1.5-4.0
# plus market_environment for the vol-regime and hedge-cost verdict bands.
# These moved out of this file in #241; keeping a copy here is the leak M1.4
# closed.

metrics:
  # Stricter carry tolerance
  net_carry:
    start: -15.0
    end: 10.0
    min_val: -3.0             # Alert at -3% carry (vs -5% default)
    mid_val: 0.0
    max_val: 2.0
    invert_colors: false

  # Higher crash protection requirements
  crash_convexity:
    start: -30.0
    end: 40.0
    min_val: -5.0             # Alert at -5% crash loss (vs -10% default)
    mid_val: 5.0              # Prefer some positive convexity
    max_val: 15.0             # Green at +15% (vs +10% default)
    invert_colors: false

  # Tighter vega exposure limits — a narrower signed display axis. NOT the vega
  # sufficiency policy band, which is vega: in ips.yaml (#241).
  vega_sufficiency:
    start: -40.0
    end: 40.0
    min_val: -15.0            # Lower tolerance for vega exposure
    mid_val: 0.0
    max_val: 15.0
    invert_colors: false

  # Narrower delta drift tolerance
  delta_drift:
    start: -40.0
    end: 40.0
    min_val: -15.0            # Alert at ±15% drift (vs ±20% default)
    mid_val: 0.0
    max_val: 15.0
    invert_colors: false

  # Earlier convexity cliff warning — the axis only. The 60/120/240 grading
  # lines are policy: set convexity.cliff_* in ips.yaml (see the header).
  convexity_cliff:
    start: 0
    end: 365
    invert_colors: false

  # More sensitive to expensive volatility
  vol_regime:
    start: 0
    end: 100
    min_val: 20               # Green only below 20th percentile
    mid_val: 50
    max_val: 70               # Red above 70th percentile (vs 75 default)
    invert_colors: true

  # Higher hedge success requirements
  hedge_success:
    start: -150
    end: 250
    min_val: -50              # Alert at -50% (vs -100% default)
    mid_val: 25               # Prefer positive returns
    max_val: 150              # Green at +150% (vs +100% default)
    invert_colors: false
