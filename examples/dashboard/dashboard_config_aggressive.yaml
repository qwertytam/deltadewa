# Aggressive Hedge Health Dashboard Configuration
# Relaxed thresholds for active traders willing to take more risk.
# Allows wider ranges before triggering alerts.

# PRESENTATION ONLY — gauge geometry. An aggressive posture is a policy choice,
# so its thresholds belong to the IPS, not here. Set them in config/ips.yaml:
#   convexity.cliff_threshold_days: 120   # warn only 4 months out
#   convexity.cliff_review_days: 60
#   convexity.cliff_urgent_days: 15
#   vega.sufficiency_min_pct / _max_pct   # wider than the default 1.5-4.0
# plus market_environment for the vol-regime and hedge-cost verdict bands.
# These moved out of this file in #241; keeping a copy here is the leak M1.4
# closed.

metrics:
  # Higher carry tolerance
  net_carry:
    start: -20.0
    end: 15.0
    min_val: -8.0             # Accept higher carry costs
    mid_val: -2.0             # Expect to pay some carry
    max_val: 3.0
    invert_colors: false

  # Accept more crash risk
  crash_convexity:
    start: -40.0
    end: 30.0
    min_val: -15.0            # Alert only at -15% crash loss
    mid_val: -5.0             # Neutral at slight negative
    max_val: 8.0              # Green at +8%
    invert_colors: false

  # Wider vega exposure tolerance — a wider signed display axis. NOT the vega
  # sufficiency policy band, which is vega: in ips.yaml (#241).
  vega_sufficiency:
    start: -60.0
    end: 60.0
    min_val: -30.0            # Accept high vega exposure
    mid_val: 0.0
    max_val: 30.0
    invert_colors: false

  # Accept larger delta drifts
  delta_drift:
    start: -60.0
    end: 60.0
    min_val: -30.0            # Alert at ±30% drift
    mid_val: 0.0
    max_val: 30.0
    invert_colors: false

  # Shorter convexity cliff concern — the axis only. The 15/60/120 grading lines
  # are policy: set convexity.cliff_* in ips.yaml (see the header).
  convexity_cliff:
    start: 0
    end: 365
    invert_colors: false

  # Less concerned about vol regime
  vol_regime:
    start: 0
    end: 100
    min_val: 30               # Green below 30th percentile
    mid_val: 50
    max_val: 80               # Red only above 80th percentile
    invert_colors: true

  # More lenient hedge success expectations
  hedge_success:
    start: -250
    end: 200
    min_val: -150             # Accept deeper losses
    mid_val: -25              # Neutral at slight underperformance
    max_val: 75               # Green at +75%
    invert_colors: false
