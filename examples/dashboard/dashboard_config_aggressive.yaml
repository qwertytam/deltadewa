# Aggressive Hedge Health Dashboard Configuration
# Relaxed thresholds for active traders willing to take more risk.
# Allows wider ranges before triggering alerts.

parameters:
  # Wider volatility regime bands
  historical_vol_low: 0.18    # 30th percentile
  historical_vol_high: 0.32   # 70th percentile
  
  # Shorter convexity cliff warning
  convexity_cliff_days: 120   # Alert only when within 4 months
  # Hedge-cost verdict thresholds (vol regime / skew / term structure) are
  # policy, not presentation — set them in market_environment in ips.yaml
  # (an aggressive posture is a policy choice, so it belongs to the IPS).

metrics:
  # Higher carry tolerance
  net_carry:
    start: -20.0
    end: 15.0
    min_val: -8.0             # Accept higher carry costs
    mid_val: -2.0             # Expect to pay some carry
    max_val: 3.0
    invert_colors: false

  # Accept more crash risk
  crash_convexity:
    start: -40.0
    end: 30.0
    min_val: -15.0            # Alert only at -15% crash loss
    mid_val: -5.0             # Neutral at slight negative
    max_val: 8.0              # Green at +8%
    invert_colors: false

  # Wider vega exposure tolerance
  vega_sufficiency:
    start: -60.0
    end: 60.0
    min_val: -30.0            # Accept high vega exposure
    mid_val: 0.0
    max_val: 30.0
    invert_colors: false

  # Accept larger delta drifts
  delta_drift:
    start: -60.0
    end: 60.0
    min_val: -30.0            # Alert at ±30% drift
    mid_val: 0.0
    max_val: 30.0
    invert_colors: false

  # Shorter convexity cliff concern
  convexity_cliff:
    start: 0
    end: 365
    min_val: 15               # Red only below 15 days
    mid_val: 60               # Yellow below 60 days
    max_val: 120              # Green above 120 days
    invert_colors: false

  # Less concerned about vol regime
  vol_regime:
    start: 0
    end: 100
    min_val: 30               # Green below 30th percentile
    mid_val: 50
    max_val: 80               # Red only above 80th percentile
    invert_colors: true

  # More lenient hedge success expectations
  hedge_success:
    start: -250
    end: 200
    min_val: -150             # Accept deeper losses
    mid_val: -25              # Neutral at slight underperformance
    max_val: 75               # Green at +75%
    invert_colors: false
