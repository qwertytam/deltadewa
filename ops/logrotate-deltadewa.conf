# ops/logrotate-deltadewa.conf — rotation for the cron job logs (#244).
# Install once, on the droplet:
#
#   sudo cp ops/logrotate-deltadewa.conf /etc/logrotate.d/deltadewa
#
# See docs/RUNBOOK.md §9 for the crontab lines that write these files.
#
# No `postrotate`/`copytruncate` needed for either stanza: every writer
# here is a short-lived cron invocation that opens its log with `>>` for
# the duration of a single run and exits — never a long-lived process
# holding the file open across a rotation — so the next cron tick just
# reopens (and, per `create` below, recreates) the file logrotate rotated
# out from under it. `weekly`/`rotate 8` keeps roughly two months of
# history, comfortably past the digest's own weekly cadence.
#
# Two stanzas because the two log sets are owned by different users
# (deploy's crontab vs. root's, RUNBOOK.md §9/§10) and logrotate's
# `create` directive is per-stanza.

/home/deploy/deltadewa/logs/*.log {
    su deploy deploy
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    create 0644 deploy deploy
}

/var/log/deltadewa-backup.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
}
