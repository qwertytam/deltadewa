# ips.example.yaml — template for config/ips.yaml (#245)
#
# config/ips.yaml holds this hedge program's real policy and is gitignored
# (see .gitignore, "#245"). Copy this file to config/ips.yaml and fill in
# your own program's numbers before running the app:
#
#   cp config/ips.example.yaml config/ips.yaml
#
# Every value below is one of two things:
#   - EXAMPLE VALUE — a placeholder standing in for a number that is a real
#     policy choice with no code fallback (deltadewa/ips_config.py has no
#     default for it). Change these; the numbers here are illustrative, not
#     a recommendation.
#   - unmarked — identical to the built-in default deltadewa/ips_config.py
#     falls back to if the field is omitted entirely (see that module's
#     ``_DEFAULT_*`` / ``DEFAULT_*`` constants). Shown explicitly here so the
#     template is a complete, working file; omitting the field would load
#     the exact same number. Still yours to override.
#
# This is the only config the app loads, and the source of truth for hedge
# program thresholds AND the pricing-engine default exercise style. Changing
# this file changes program behaviour: see deltadewa/ips_config.py for the
# loader and deltadewa/analysis/hedge_triggers.py for consumers. (There was
# once a presentation-only dashboard_config_*.yaml; #279 retired it.)

program:
  name: "SPX tail hedge — example program"  # EXAMPLE VALUE
  instrument: SPX            # underlying
  # The market calendar the program trades on. This decides which day's close
  # a position is priced against, so it moves numbers, not just labels: with a
  # UTC clock the whole book repriced a day forward at 20:00 New York (#182).
  # Defaults to America/New_York; set it to your own exchange's timezone.
  timezone: America/New_York

pricing:
  exercise_style: EUROPEAN   # SPX/XSP = EUROPEAN (cash-settled); SPY/stocks = AMERICAN

budget:
  # "Handbook" in the comments below is
  # https://qwertytam.github.io/deltadewa-handbook/
  # Premium budget, % of portfolio / yr. Handbook family-office benchmark is
  # 0.5-1.5%, with 1% "a practical ceiling". EXAMPLE VALUE sits at that
  # ceiling as a reasonable starting point — raise or lower deliberately in
  # policy for your own program's carry tolerance.
  annual_carry_pct: 1.0

convexity:
  crash_scenario_pct: -25.0     # EXAMPLE VALUE — the crash move you're
                                 # hedging against; single source of truth
                                 # for it. The band below is defined AT this
                                 # depth (handbook part-7,
                                 # typical-hedge-program-targets: +10%..+20%
                                 # at -25% SPX) — move this and you must
                                 # re-derive target_min/max_pct, not just
                                 # this line (#344).
  target_min_pct: 10.0          # EXAMPLE VALUE
  target_max_pct: 20.0          # EXAMPLE VALUE
  crash_vol_shock: 0.15         # flat additive vol bump at the crash spot (M1.2)
  skew_steepening: 0.08         # EXAMPLE VALUE — extra vol reached at each
                                 # leg's own ~10-delta wing, capped there and
                                 # interpolated below it (M1.7; methodology
                                 # §2). 0.0 keeps the flat bump.
  skew_reference_delta: 0.10    # put-delta magnitude of that wing (the anchor the
                                 # steepening is calibrated to). Range (0, 0.5).
  crash_floor_reported: true    # surface the intrinsic-floor column
  # Hedge efficiency = crash payoff / annual carry (handbook's interpretation
  # table). Below min reads POOR, above max reads ATTRACTIVE.
  efficiency_min_ratio: 3.0
  efficiency_max_ratio: 6.0
  # Convexity cliff: cliff_threshold_days is where the high-gamma region is
  # deemed to start, and the metric reports the nearest long put's runway
  # before it gets there; review/urgent band that runway. Owned here only —
  # promoted out of the retired dashboard.yaml gauge (#241, #279).
  #
  # Unrelated to triggers.roll_at_months_remaining below despite both being a
  # "days before expiry matters" number (#338) — this is the convexity/gamma
  # runway threshold, that is the roll trigger. EXAMPLE VALUEs here are
  # deliberately decoupled (150, not 180) from roll_at_months_remaining * 30
  # so the two do not read as one setting by numeric coincidence.
  cliff_threshold_days: 150   # EXAMPLE VALUE
  cliff_review_days: 90
  cliff_urgent_days: 30

drawdown:
  max_tolerance_pct: 15.0    # EXAMPLE VALUE

sizing:
  # Beta-adjusted hedge sizing (handbook §2499). The hedge is sized against the
  # SPX-equivalent exposure = book value * portfolio_beta. This is a USER INPUT,
  # not estimated here — recalc it at least annually (or on a >10% position
  # change) and set it in policy. SPX puts hedge only the systematic (market-
  # beta) component, so they UNDER-PROTECT idiosyncratic risk on a concentrated
  # single-name book. 1.0 = protected book assumed to move 1:1 with the index,
  # the sensible starting point before you've computed your book's real beta.
  portfolio_beta: 1.0

vega:
  # Vega sufficiency (handbook Part X #4): the book's % value change per +10 vol
  # points. Below min the hedge barely responds to a vol spike; above max it is
  # vega-dominated rather than convexity-driven.
  #
  # MIND THE SCALE. The metric divides by total portfolio value (options
  # *plus* underlying), so on a tail hedge — where the equity leg dominates —
  # real readings are low single digits, not tens. The handbook gives no
  # numeric band, so set these deliberately for your program; the values
  # below are the built-in default, calibrated against the shipped example
  # portfolios (examples/portfolios/spx_tail_20m.yaml reads +2.70%,
  # spx_protective_put.yaml +2.29% — both public sample data, not real
  # positions) rather than derived from anything private (#241).
  sufficiency_min_pct: 1.5
  sufficiency_max_pct: 4.0

market_environment:
  # Hedge-cost verdict policy (CHEAP/FAIR/EXPENSIVE) — these drive a decision,
  # not a display, so they belong here rather than in presentation config.
  vol_regime_low: 0.15         # decimal IV; VIX/100 at/below = cheap-vol regime
  vol_regime_high: 0.35        # decimal IV; VIX/100 at/above = high-vol regime
  skew_low_pctile: 30          # SKEW percentile (0-100); below = benign skew
  skew_high_pctile: 70         # SKEW percentile (0-100); above = stressed skew
  term_contango_tolerance: 0.5 # VIX points; smaller diffs read FLAT
  data_ttl_minutes: 1440       # EXAMPLE VALUE — how long a fetched value
                                # stays trustworthy; past this a cache hit
                                # reads STALE, not CACHED. Set this to
                                # ~1.5x your own market-data refresh
                                # cadence (e.g. a cron running every 24h
                                # wants a TTL a bit past 24h), or every read
                                # will be STALE right before the next
                                # refresh.
  vix_very_high: 40  # VIX above this -> monetize existing hedges, buy nothing
  vix_caution: 25    # VIX above this -> avoid new purchases except rolls
  vix_low: 15        # VIX at/below this -> increased urgency to accumulate
                      # These back entry_timing_tree's three stops (M2.8).
  spot_divergence_warn_pct: 2.0  # EXAMPLE VALUE — percent the observed
                                  # market spot may diverge from the book's
                                  # hand-entered spot before /monitor's
                                  # cross-check flags it (#336). Display
                                  # policy only; never feeds a calculation.

pricing_inputs:
  # Batch 3d / #367: review-cadence policy for the four hand-entered
  # pricing inputs — per-leg IV, spot, risk-free rate, dividend yield —
  # the program never fetches and so cannot grade against a feed. Each
  # value is the maximum number of days a stamped input may go
  # unconfirmed before the provenance ledger grades it AGING; an input
  # that was never stamped at all (e.g. a position saved before this
  # section existed) grades UNKNOWN regardless of this policy — a
  # missing stamp is not the same as a fresh one.
  spot_max_age_days: 1              # spot should be re-eyed every session
  volatility_max_age_days: 7        # per-leg IV, a weekly review cadence
  risk_free_rate_max_age_days: 30   # book-level rate, a monthly cadence
  dividend_yield_max_age_days: 90   # book-level yield, a quarterly cadence

triggers:
  target_delta_ratio_pct: 90.0    # intended net-delta-to-equity ratio;
                                   # deviation is measured (in pp) from this,
                                   # not from full delta-neutrality
  # Renamed from delta_drift_* (4.2, #338/#335): "Delta Drift" is the
  # handbook's own name for a different metric (Part X §13). This is how far
  # net delta may deviate from target_delta_ratio_pct above.
  delta_ratio_deviation_warn_pct: 4.0    # EXAMPLE VALUE — pp of deviation from target -> MONITOR
  delta_ratio_deviation_action_pct: 8.0  # EXAMPLE VALUE — pp of deviation from target -> ACTION
  theta_cost_excellent_pct: 1.0    # annual theta % below this -> EXCELLENT
  theta_cost_acceptable_pct: 1.5   # EXAMPLE VALUE — ...below this -> ACCEPTABLE, else EXPENSIVE
  expiry_urgent_days: 7            # DTE below this -> URGENT (roll immediately)
  expiry_soon_days: 21             # DTE below this -> plan rolls SOON
  roll_at_months_remaining: 6.0   # EXAMPLE VALUE — roll trigger: an option
                                   # rolls once maturity REMAINING falls below
                                   # this. Unrelated to convexity's
                                   # cliff_threshold_days above (#338) — that
                                   # is the gamma-runway threshold, this is
                                   # the roll trigger; kept at a different
                                   # number of days on purpose.
  # Handbook Rule 2 — Market Rally Rebalance Trigger. Measured as the rally in
  # spot since a tranche's OWN entry (entry_spot), not since program
  # inception. Each band carries its own action: monitor / review and consider
  # rolling up / act, strikes are too deep OTM / rebalance urgently, the
  # original strikes may give negligible protection. Replaces the single
  # rally_rebalance_pct (#297), whose name did not say which of these four
  # boundaries it was and whose value sat on none of them.
  rally_monitor_pct: 5.0    # monitor: recompute crash convexity at current spot
  rally_review_pct: 10.0    # review: roll strikes up if convexity target missed
  rally_action_pct: 15.0    # act: strikes likely too deep OTM, roll the ladder
  rally_urgent_pct: 20.0    # urgent: close and re-establish
  strike_drift_max_otm_pct: 40.0 # EXAMPLE VALUE
  roll_review_buffer: 1.5        # REVIEW fires within roll_at_months_remaining * this
  strike_drift_review_fraction: 0.75  # REVIEW fires within this fraction
                                       # of strike_drift_max_otm_pct
  # Gamma drift = % of the hedged equity that net delta shifts per 1% spot move
  # (|gamma|*spot/|underlying_qty|); book-size-independent.
  gamma_drift_moderate_pct: 2.0  # drift below this -> LOW, above -> MODERATE
  gamma_drift_high_pct: 5.0      # drift above this -> HIGH (active rebalancing)

monetization:
  schedule:                      # EXAMPLE VALUE — hedge-gain -> fraction to sell
    - {gain_pct: 100, sell_pct: 20}
    - {gain_pct: 250, sell_pct: 20}
    - {gain_pct: 500, sell_pct: 20}

# Where the maturity term structure is cut, for the vega term-exposure panel
# and the carry panel's theta-by-bucket (#305). POLICY, not presentation:
# these edges decide what "long-dated" means for this program, and a fund
# running 3-month rolls wants genuinely different cuts from one running an
# 18-month ladder. Optional — omit the section for the tail-hedge defaults
# below.
maturity_buckets:
  # Inclusive upper bounds in days, strictly increasing. n edges give n+1
  # buckets: an open-ended final bucket above the last edge is always added.
  # Below: 0-30 / 31-90 / 91-180 / 181-365 / 366-730 / 730+ days.
  # The pre-#305 scheme (7/30/60/90) was sized for weekly options and put an
  # entire 18-month ladder in one terminal bucket, so the panel answered
  # nothing.
  edges_days: [30, 90, 180, 365, 730]
