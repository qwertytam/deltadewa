# ips.yaml — hedge program policy (the "what we're allowed/aiming to do")
#
# This is the source of truth for hedge program thresholds AND the
# pricing-engine default exercise style. Unlike dashboard_config_*.yaml
# (presentation-only gauge ranges), changing this file changes program
# behaviour: see deltadewa/ips_config.py for the loader and
# deltadewa/analysis/hedge_triggers.py / deltadewa/dashboard/setup.py for
# consumers.

program:
  name: "SPX tail hedge — personal"
  instrument: SPX            # underlying

pricing:
  exercise_style: EUROPEAN   # SPX/XSP = EUROPEAN (cash-settled); SPY/stocks = AMERICAN

budget:
  # Premium budget, % of portfolio / yr. Handbook family-office benchmark is
  # 0.5-1.5%, with 1% "a practical ceiling" — the shipped default sits at that
  # ceiling, not above it. Raise deliberately in policy if your program runs a
  # larger carry.
  annual_carry_pct: 1.0

convexity:
  crash_scenario_pct: -25.0     # single source of truth for the crash move
  target_min_pct: 15.0
  target_max_pct: 25.0
  crash_vol_shock: 0.15         # flat additive vol bump at the crash spot (M1.2)
  skew_steepening: 0.10         # extra vol reached at each leg's own ~10-delta
                                # wing, capped there and interpolated below it
                                # (M1.7; methodology §2). 0.0 keeps the flat bump.
  skew_reference_delta: 0.10    # put-delta magnitude of that wing (the anchor the
                                # steepening is calibrated to). Range (0, 0.5).
  crash_floor_reported: true    # surface the intrinsic-floor column
  # Hedge efficiency = crash payoff / annual carry (handbook "Hedge Efficiency
  # Ratio", docs/hedging handbook.md:2032; the same ratio the Carry vs.
  # Convexity chart states in percentages at :4337). Bands are the handbook's
  # own interpretation table at :4342-4348 — below min reads POOR, above max
  # reads ATTRACTIVE. Policy, not presentation: this is the "is this hedge
  # worth the money" mandate question.
  efficiency_min_ratio: 3.0
  efficiency_max_ratio: 6.0

drawdown:
  max_tolerance_pct: 20.0

sizing:
  # Beta-adjusted hedge sizing (handbook §2499). The hedge is sized against the
  # SPX-equivalent exposure = book value * portfolio_beta. This is a USER INPUT,
  # not estimated here — recalc it at least annually (or on a >10% position
  # change) and set it in policy. SPX puts hedge only the systematic (market-
  # beta) component, so they UNDER-PROTECT idiosyncratic risk on a concentrated
  # single-name book. 1.0 = protected book assumed to move 1:1 with the index.
  portfolio_beta: 1.0

vega:
  # Vega sufficiency (handbook Part X #4): the book's % value change per
  # +10 vol points. Below min the hedge barely responds to a vol spike;
  # above max it is vega-dominated rather than convexity-driven. "Is the
  # hedge big enough" is a mandate question — the same class as the
  # convexity band above — so it lives here, not in dashboard.yaml.
  #
  # The handbook gives this metric no numeric band, only a Low<->High
  # gauge. These values are carried over from dashboard.yaml's existing
  # vega_sufficiency gauge so that moving the metric onto a policy surface
  # didn't silently change what a reading means. Set them deliberately for
  # this program rather than treating them as derived.
  sufficiency_min_pct: 20.0
  sufficiency_max_pct: 50.0

market_environment:
  # Hedge-cost verdict policy (CHEAP/FAIR/EXPENSIVE) — these drive a decision,
  # not a display, so they live here, not in dashboard.yaml (presentation).
  vol_regime_low: 0.15         # decimal IV; VIX/100 at/below = cheap-vol regime
  vol_regime_high: 0.35        # decimal IV; VIX/100 at/above = high-vol regime
  skew_low_pctile: 25          # SKEW percentile (0-100); below = benign skew
  skew_high_pctile: 75         # SKEW percentile (0-100); above = stressed skew
  term_contango_tolerance: 0.5 # VIX points; smaller diffs read FLAT
  data_ttl_minutes: 2160       # how long a fetched value stays trustworthy;
                               # past this a cache hit reads STALE, not CACHED.
                               # M2.6's refresh cron runs ~daily (24h); 2160min
                               # (36h) is 1.5x that interval — headroom so
                               # ordinary cron jitter doesn't flap the banner,
                               # tight enough that one fully-missed refresh
                               # still reads STALE before a second one does.
                               # This is a policy answer to "how old may data
                               # be before a decision shouldn't rely on it",
                               # not a number tuned to the crontab — if ops
                               # can't meet it, STALE is the correct signal.
  vix_very_high: 40  # VIX above this -> monetize existing hedges, buy nothing
  vix_caution: 25    # VIX above this -> avoid new purchases except rolls
  vix_low: 15        # VIX at/below this -> increased urgency to accumulate
                      # These back entry_timing_tree's three stops (M2.8);
                      # were hardcoded Python defaults before this section
                      # existed, now required (fail-loud) at the call site.

triggers:
  target_delta_ratio_pct: 90.0    # intended net-delta-to-equity ratio; drift is
                                   # measured (in pp) as deviation from this, not
                                   # from full delta-neutrality
  delta_drift_warn_pct: 5.0        # pp of drift from target -> MONITOR
  delta_drift_action_pct: 10.0     # pp of drift from target -> ACTION
  theta_cost_excellent_pct: 1.0    # annual theta % below this -> EXCELLENT
  theta_cost_acceptable_pct: 2.0   # ...below this -> ACCEPTABLE, else EXPENSIVE
  expiry_urgent_days: 7            # DTE below this -> URGENT (roll immediately)
  expiry_soon_days: 21             # DTE below this -> plan rolls SOON
  roll_time_months: 9.0          # roll when maturity below this
  rally_rebalance_pct: 15.0      # market rally that forces a re-strike review
  strike_drift_max_otm_pct: 45.0
  roll_review_buffer: 1.5        # REVIEW fires within roll_time_months * this
  strike_drift_review_fraction: 0.75  # REVIEW fires within this fraction
                                       # of strike_drift_max_otm_pct
  # Gamma drift = % of the hedged equity that net delta shifts per 1% spot move
  # (|gamma|*spot/|underlying_qty|); book-size-independent. A tail hedge is
  # deliberately gamma-light (canonical SPX book ~1.3% -> LOW). >2%/1% move
  # warrants watching; >5% warrants active rebalancing.
  gamma_drift_moderate_pct: 2.0  # drift below this -> LOW, above -> MODERATE
  gamma_drift_high_pct: 5.0      # drift above this -> HIGH (active rebalancing)

monetization:
  schedule:                      # hedge-gain -> fraction to sell
    - {gain_pct: 100, sell_pct: 25}
    - {gain_pct: 200, sell_pct: 25}
    - {gain_pct: 400, sell_pct: 25}
