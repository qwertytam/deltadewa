# dashboard.example.yaml — template for config/dashboard.yaml (#245)
#
# config/dashboard.yaml is gitignored (see .gitignore, "#245"). Copy this
# file to config/dashboard.yaml to use it, or leave it uncopied — a missing
# file falls back to these exact values anyway (they match
# HedgeHealthDashboard's built-in defaults), so copying only matters once
# you want to change something.
#
#   cp config/dashboard.example.yaml config/dashboard.yaml
#
# PRESENTATION ONLY. Every value here is gauge geometry — where an axis starts
# and ends, and where it changes colour. Nothing here decides anything. Any
# threshold that answers a mandate question ("is the hedge big enough", "when
# does decaying convexity force a roll", "is vol cheap") is policy and lives in
# config/ips.yaml (see ips.example.yaml). Keeping a copy of a policy number
# here is the leak M1.4 closed and #241 closed again — do not re-add one.
#
# Removed from this file by #241, now owned by ips.yaml:
#   parameters.convexity_cliff_days  -> convexity.cliff_threshold_days
#   convexity_cliff min/mid/max_val  -> convexity.cliff_urgent/review/threshold_days
# Vol-regime band + hedge-cost verdict thresholds (skew / term structure) were
# already policy — see market_environment in ips.yaml.

metrics:
  # 1. Net Carry (Theta) - Annualized theta as % of underlying
  net_carry:
    start: -10.0              # Gauge start value
    end: 10.0                 # Gauge end value
    min_val: -5.0             # Red zone begins (paying heavy carry)
    mid_val: 0.0              # Neutral point
    max_val: 2.0              # Green zone begins (earning carry)
    invert_colors: false      # Normal coloring: negative=red, positive=green

  # 2. Crash Convexity - Hedge P&L at the IPS crash scenario as % of underlying
  #    (the crash move is policy: convexity.crash_scenario_pct in ips.yaml)
  crash_convexity:
    start: -30.0
    end: 30.0
    min_val: -10.0            # Red: losing money in crash
    mid_val: 0.0              # Neutral: breakeven
    max_val: 10.0             # Green: hedge working well
    invert_colors: false

  # 3. Vega Exposure - Portfolio % change per +10 vol shock
  #    NOT the vega sufficiency policy band — that is vega: in ips.yaml, and it
  #    is a one-sided magnitude band on a low-single-digit scale. This is a
  #    signed, symmetric display axis, and it is mis-scaled for the metric it
  #    plots: real books read low single digits, which is a needle sitting near
  #    the midpoint of a -50..+50 axis. Left as-is deliberately — rescaling it
  #    is a widgets/ change on the Jupyter surface being retired (#242), and
  #    #241 mistook these numbers for the policy band once already.
  vega_sufficiency:
    start: -50.0
    end: 50.0
    min_val: -20.0            # High negative vega exposure
    mid_val: 0.0              # Low vega exposure
    max_val: 20.0             # High positive vega exposure
    invert_colors: false

  # 4. Delta Drift - |deviation| from the target net-delta ratio, in pp
  #    (the target is policy: triggers.target_delta_ratio_pct in ips.yaml)
  delta_drift:
    start: 0.0
    end: 30.0
    min_val: 5.0              # Green: within the warn band (at target)
    mid_val: 7.5             # Yellow: MONITOR
    max_val: 10.0             # Red: beyond the action band
    invert_colors: true       # Inverted: small drift=green, large=red

  # 5. Time to Convexity Cliff - Days until puts enter high-gamma region
  #    Axis geometry only. The grading lines are policy: set
  #    convexity.cliff_urgent_days / cliff_review_days / cliff_threshold_days in
  #    ips.yaml. Omitting them here leaves the Jupyter gauge on the hardcoded
  #    fallback in widgets/health_dashboard.py, which is obsolete along with that
  #    surface (#242); /design reads the IPS values directly.
  convexity_cliff:
    start: 0
    end: 365
    invert_colors: false

  # 6. Volatility Regime - Current IV percentile (0=cheap, 100=expensive)
  vol_regime:
    start: 0
    end: 100
    min_val: 25               # Green: cheap hedges (<25th percentile)
    mid_val: 50               # Yellow: median
    max_val: 75               # Red: expensive hedges (>75th percentile)
    invert_colors: true       # Inverted: low=green, high=red

  # 7. Hedge Success - Hedge P&L vs cumulative carry paid
  hedge_success:
    start: -200
    end: 200
    min_val: -100             # Red: hedge underperforming
    mid_val: 0                # Yellow: breakeven
    max_val: 100              # Green: hedge outperforming
    invert_colors: false
