[project]
name = "deltadewa"
version = "0.1.0"
description = "American options dashboard using QuantLib"
readme = "README.md"
authors = [{ name = "qwertytam" }]
requires-python = ">=3.11,<4.0"

dependencies = [
	"QuantLib>=1.32",
	"jupyter>=1.0.0",
	"jupyterlab>=4.0.0",
	"pandas>=2.0.0",
	"numpy>=1.24.0",
	"matplotlib>=3.7.0",
	"ipywidgets>=8.1.0",
	"plotly>=5.18.0",
	"seaborn>=0.13.2",
	"PyYAML>=5.3",
	"nbconvert[webpdf] (>=7.17.0,<8.0.0)",
	"scipy (>=1.17.0,<2.0.0)",
	"playwright (>=1.58.0,<2.0.0)",
]

[project.optional-dependencies]
dev = [
	"pytest>=7.4.0",
	"black>=23.12.0",
	"ruff>=0.1.9",
	"pandas-stubs>=2.3.3.251201",
	"nbstripout>=0.6.1",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 80
target-version = ['py311']

[tool.ruff]
line-length = 80
target-version = "py311"

[dependency-groups]
dev = [
	"ruff (>=0.5.3)",
	"debugpy (>=1.8.19,<2.0.0)",
	"nbstripout (>=0.9.0,<0.10.0)",
	"nbqa (>=1.9.1,<2.0.0)",
	"pylint (>=4.0.4,<5.0.0)",
	"jupytext (>=1.19.1,<2.0.0)",
]
