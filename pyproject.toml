[project]
name = "deltadewa"
version = "0.2.0"
description = "Options dashboard using QuantLib"
readme = "README.md"
authors = [{ name = "qwertytam" }]
requires-python = ">=3.11,<4.0"

dependencies = [
	"QuantLib>=1.32",
	"jupyter>=1.0.0",
	"jupyterlab (>=4.5.7,<5.0.0)",
	"pandas>=2.0.0",
	"numpy>=1.24.0",
	"matplotlib>=3.7.0",
	"ipywidgets>=8.1.0",
	"ipyfilechooser>=0.6.0,<0.7.0",
	"plotly>=5.18.0",
	"seaborn>=0.13.2",
	"PyYAML>=5.3",
	"nbconvert (>=7.17.1,<8.0.0)",
	"scipy (>=1.17.0,<2.0.0)",
	"playwright (>=1.58.0,<2.0.0)",
	"black (>=26.3,<27.0)",
	"bleach (>=6.3,<7.0)",
	"idna (>=3.15,<4.0)",
	"jupyter-server (>=2.18,<3.0)",
	"mistune (>=3.2.1,<4.0.0)",
	"notebook (>=7.5.6,<8.0.0)",
	"pillow (>=12.2,<13.0)",
	"pip (>=26.1,<27.0)",
	"pygments (>=2.20,<3.0)",
	"pytest (>=9.0.3,<10.0.0)",
	"requests (>=2.33,<3.0)",
	"tornado (>=6.5.5,<7.0.0)",
	"urllib3 (>=2.7,<3.0)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 80

[tool.mypy]
mypy_path = ["typings"]
strict = true
# tests/ mirrors ruff's ANN/D exemptions — exclude from strict checking.
# typings/ are stub inputs, not subject to strict checking themselves.
exclude = ["^tests/", "^typings/"]

[[tool.mypy.overrides]]
module = ["ipywidgets", "ipywidgets.*", "ipyfilechooser", "ipyfilechooser.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
preview = true
select = [
	"ANN", # type annotations
	"ARG", # falke8 unused arguments
	"B",   # flake8-bugbear
	"COM", # flake8-commas (specifically trailing commas)
	"C4",  # flake8-comprehensions
	"D",   # pydocstyle
	"E",   # Error
	"ERA", # eradicate commented out code
	"F",   # pyflakes
	"FIX", # flake8 fixme
	"I",   # isort
	"ISC", # flake8-implicit-str-concat
	"N",   # pep8-naming
	# "NPY",  # NumPy specific rules
	"PERF", # Perflint: performance
	"PIE",  # flake8-pie 
	"PGH",  # pygrep-hooks
	"PTH",  # flake8-use-pathlib 
	"Q",    # flake8-quotes
	"RUF",  # Ruff specific rules
	"S",    # bandit security checks 
	"SIM",  # flake8-simplify
	"UP",   # pyupgrade
	"W",    # Warning
	# "YTT",  # flake8-2020 
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "D", "ARG"]  # asserts, annotations, docstrings, unused-args are noise in tests
"typings/**" = ["ANN", "D"]  # stub files use Any freely; docstrings not required

[dependency-groups]
dev = [
	"ruff (>=0.5.3)",
	"debugpy (>=1.8.19,<2.0.0)",
	"mypy>=1.10",
	"types-PyYAML>=6.0",
	"nbstripout (>=0.9.0,<0.10.0)",
	"nbqa (>=1.9.1,<2.0.0)",
	"pylint (>=4.0.4,<5.0.0)",
	"jupytext (>=1.19.1,<2.0.0)",
	"pytest>=7.4.0",
	"pandas-stubs>=2.3.3.251201",
]

[tool.pytest.ini_options]
filterwarnings = [
	"ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
	"ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
	"ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.pylint.main]
py-version = "3.11"
jobs = 0
ignore-paths = ["typings"]
fail-under = 10.0

[tool.pylint.format]
max-line-length = 80

[tool.pylint."messages control"]
disable = [
  "line-too-long", "trailing-whitespace", "missing-final-newline",
  "unused-import", "wrong-import-order", "wrong-import-position", "ungrouped-imports",
  "invalid-name",
  "missing-module-docstring", "missing-class-docstring", "missing-function-docstring",
  "import-error",
  "too-few-public-methods",
  # R0917 always co-fires with R0913; keeping one source of truth for arity
  "too-many-positional-arguments",
  # C0302 large but cohesive widget/dashboard modules are acceptable
  "too-many-lines",
]

[tool.pylint.design]
# Limits set to the observed codebase ceiling — any future code exceeding these
# is a genuine regression.  Comments name the current ceiling holder.
max-args        = 18   # widgets/gauges.py GaugeIndicator.__init__
max-locals      = 65   # visualization/pnl_charts.py plot_pnl_distribution_with_metrics
max-attributes  = 27   # deltadewa/valuation.py OptionValuation (QuantLib wrapper)
max-branches    = 22   # analysis/summary.py format_risk_reward_summary
max-statements  = 130  # visualization/convenience.py plot_greeks_consolidated
max-returns     = 8    # analysis/decision_matrix.py
max-bool-expr   = 6    # analysis/roll_status.py _check_roll_verdict

[tool.pylint.similarities]
# Short patterns (6-10 lines) are typically calling-convention idioms for the
# same shared API, not structural duplication worth extracting.  Genuine
# R0801 findings still surface at 12+ lines.
min-similarity-lines = 12
ignore-imports       = true   # import blocks appear in every module; skip them
ignore-docstrings    = true   # docstring templates are not logic duplication
