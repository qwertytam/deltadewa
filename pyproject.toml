[project]
name = "deltadewa"
version = "0.8.1"
description = "Options dashboard using QuantLib"
readme = "README.md"
authors = [{ name = "qwertytam" }]
requires-python = ">=3.11,<4.0"

dependencies = [
	"QuantLib>=1.32",
	"pandas>=2.0.0",
	"numpy>=1.24.0",
	"plotly>=5.18.0",
	"PyYAML>=5.3",
	"scipy (>=1.17.0,<2.0.0)",
	"idna (>=3.15,<4.0)",
	"pytest (>=9.0.3,<10.0.0)",
	"requests (>=2.33,<3.0)",
	"urllib3 (>=2.7,<3.0)",
	"dash (>=4.4.1,<5.0.0)",
	"gunicorn (>=26.0.0,<27.0.0)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
mypy_path = ["typings"]
strict = true
# tests/ mirrors ruff's ANN/D exemptions — exclude from strict checking.
# typings/ are stub inputs, not subject to strict checking themselves.
exclude = ["^tests/", "^typings/"]

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
preview = true
select = [
	"ANN", # type annotations
	"ARG", # falke8 unused arguments
	"B",   # flake8-bugbear
	"COM", # flake8-commas (specifically trailing commas)
	"C4",  # flake8-comprehensions
	"D",   # pydocstyle
	"E",   # Error
	"ERA", # eradicate commented out code
	"F",   # pyflakes
	"FIX", # flake8 fixme
	"I",   # isort
	"ISC", # flake8-implicit-str-concat
	"N",   # pep8-naming
	# "NPY",  # NumPy specific rules
	"PERF", # Perflint: performance
	"PIE",  # flake8-pie 
	"PGH",  # pygrep-hooks
	"PTH",  # flake8-use-pathlib 
	"Q",    # flake8-quotes
	"RUF",  # Ruff specific rules
	"S",    # bandit security checks 
	"SIM",  # flake8-simplify
	"UP",   # pyupgrade
	"W",    # Warning
	# "YTT",  # flake8-2020 
]
ignore = [
	"missing-trailing-comma", # conflicts with ruff formatter (formatter manages trailing commas)
	"incorrect-blank-line-before-class",   # incompatible with D211; codebase uses D211 (no blank line before class docstring)
	"multi-line-summary-second-line",   # incompatible with D212; codebase uses D212 (summary on first line)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
	"assert",
	"ANN",
	"D",
	"ARG",
] # asserts, annotations, docstrings, unused-args are noise in tests
"typings/**" = ["ANN", "D"] # stub files use Any freely; docstrings not required

[dependency-groups]
dev = [
	"ruff (>=0.16.0)",
	"pre-commit (>=4.0,<5.0)",
	"debugpy (>=1.8.19,<2.0.0)",
	"mypy>=1.10",
	"types-PyYAML>=6.0",
	"pylint (>=4.0.4,<5.0.0)",
	"pytest>=7.4.0",
	"pandas-stubs>=2.3.3.251201",
	"pytest-cov (>=7.1.0,<8.0.0)",
	# The whole ipywidgets/Jupyter stack went with deltadewa/widgets/ +
	# deltadewa/dashboard/ in #279 — the layer was its only consumer, and
	# Stage 4.3 had already deleted the notebooks. Removed there: jupyter,
	# jupyterlab, notebook, jupyter-server, nbconvert, ipywidgets,
	# ipyfilechooser, seaborn, and the mistune/bleach/tornado/pip pins that
	# existed only to hold that stack's transitives to patched versions.
	#
	# matplotlib STAYS: it is imported at module scope by ten
	# deltadewa/visualization/ submodules and by formatters/values.py, and
	# tests/test_visualization/ exercises them. It is `dev` rather than main
	# because visualization/__init__.py carries no re-exports and the app
	# imports only the *_plotly submodules, so matplotlib is never on the
	# production import path (Dockerfile installs --only main).
	"matplotlib>=3.7.0",
	# Kept for transitive-pin hygiene, but NOT Jupyter residue — both are
	# required by packages that survive: pillow by matplotlib, pygments by
	# pytest (a main dependency).
	"pillow (>=12.2,<13.0)",
	"pygments (>=2.20,<3.0)",
]
# Test-only: the Playwright browser driver behind tests/test_app's Dash
# smoke suite. Unused at container runtime.
test = [
	"playwright (>=1.58.0,<2.0.0)",
]

[tool.pytest.ini_options]
filterwarnings = [
	"ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
	"ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
	"ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.pylint.main]
py-version = "3.11"
jobs = 0
ignore-paths = ["typings"]
fail-under = 10.0

[tool.pylint.format]
max-line-length = 80

[tool.pylint."messages control"]
disable = [
	"line-too-long",
	"trailing-whitespace",
	"missing-final-newline",
	"unused-import",
	"wrong-import-order",
	"wrong-import-position",
	"ungrouped-imports",
	"invalid-name",
	"missing-module-docstring",
	"missing-class-docstring",
	"missing-function-docstring",
	"import-error",
	"too-few-public-methods",
	# R0917 always co-fires with R0913; keeping one source of truth for arity
	"too-many-positional-arguments",
	# C0302 — app/pages/design.py (~3350 lines) and
	# reporting/program_report.py (~1000) are large but cohesive, and both
	# exceed pylint's 1000-line default
	"too-many-lines",
]

[tool.pylint.design]
max-args = 8
max-locals = 25
max-attributes = 27 # deltadewa/valuation.py OptionValuation (QuantLib wrapper)
max-branches = 15
max-statements = 60
max-returns = 8     # analysis/decision_matrix.py
max-bool-expr = 6   # analysis/roll_status.py _check_roll_verdict

[tool.pylint.similarities]
# Short patterns (6-10 lines) are typically calling-convention idioms for the
# same shared API, not structural duplication worth extracting.  Genuine
# R0801 findings still surface at 12+ lines.
min-similarity-lines = 12
ignore-imports = true     # import blocks appear in every module; skip them
ignore-docstrings = true  # docstring templates are not logic duplication

[tool.coverage.run]
source = ["deltadewa"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
