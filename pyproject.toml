[project]
name = "deltadewa"
version = "0.1.0"
description = "American options dashboard using QuantLib"
readme = "README.md"
authors = [{ name = "qwertytam" }]
requires-python = ">=3.11,<4.0"

dependencies = [
	"QuantLib>=1.32",
	"jupyter>=1.0.0",
	"jupyterlab>=4.0.0",
	"pandas>=2.0.0",
	"numpy>=1.24.0",
	"matplotlib>=3.7.0",
	"ipywidgets>=8.1.0",
	"plotly>=5.18.0",
	"seaborn>=0.13.2",
	"PyYAML>=5.3",
	"nbconvert[webpdf] (>=7.17.0,<8.0.0)",
	"scipy (>=1.17.0,<2.0.0)",
	"playwright (>=1.58.0,<2.0.0)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = [
	"F",   # pyflakes
	"E",   # pycodestyle errors
	"W",   # pycodestyle warnings
	"C90", # mccabe complexity
	"N",   # pep8-naming
	"Q",   # flake8-quotes
	"I",   # isort
	"UP",  # pyupgrade
	"B",   # bugbear
	"SIM", # flake8-simplify
	"RUF", # ruff-specific rules
]
ignore = [
	"E501", # line too long
	"W293", # blank line contains whitespace
	"C901", # mccabe complexity
	"N813", # argument name should be lowercase
	"N814", # variable in function should be lowercase
	"Q000", # double quotes
	# "I001",   # isort
	"B007",   # f-string in logging function
	"RUF003", # ruff-specific rule
	"RUF010", # ruff-specific rule
	"RUF001", # ruff-specific rule
	"RUF003", # ruff-specific rule
]

[dependency-groups]
dev = [
	"ruff (>=0.5.3)",
	"debugpy (>=1.8.19,<2.0.0)",
	"nbstripout (>=0.9.0,<0.10.0)",
	"nbqa (>=1.9.1,<2.0.0)",
	"pylint (>=4.0.4,<5.0.0)",
	"jupytext (>=1.19.1,<2.0.0)",
	"pytest>=7.4.0",
	"pandas-stubs>=2.3.3.251201",
]

[tool.pytest.ini_options]
filterwarnings = [
	"ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
	"ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
	"ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
